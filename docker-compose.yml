services:
  kanban:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanban-app
    restart: unless-stopped
    ports:
      # Expõe na porta 3000 apenas no localhost da VPS para o Caddy encaminhar
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      # SESSION_SECRET é opcional: se omitido, o app gera uma chave criptográfica única e aleatória em data/session.key
      # - SESSION_SECRET=sua-chave-aqui
    volumes:
      # Persistência de dados fora do contêiner (arquivos .md, imagens e usuários)
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/auth/me || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

